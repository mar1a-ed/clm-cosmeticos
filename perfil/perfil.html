<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="../favicon/favicon.ico">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="../produtos/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600&family=Playfair+Display:wght@400;600&display=swap" rel="stylesheet">
    <title>Perfil do Usuário</title>
</head>
<body>
    <!-- ===== HEADER PADRÃO ===== -->
    <header class="navbar">
        <div class="iconLogo">
            <a href="../inicio/inicio.html">
                <img src="../imgs/clm_cosmeticos_logo.jpg" alt="iconLogo" style="height: 50px;">
            </a>
        </div>
        
        <!-- BOTÃO HAMBÚRGUER -->
        <button class="menu-toggle" id="menuToggle" aria-label="Menu">
            <span></span>
            <span></span>
            <span></span>
        </button>
        
        <div class="menubar" id="menuNav">
            <a href="../produtos/produtos.html">Produtos</a>
            <a href="../acessorios/acessorios.html">Acessórios</a>
            <a href="../kits/kits.html">Kits</a>
        </div>
        <div class="iconsPerfil">
            <a href="../favoritos/favoritos.html"><img src="../imgs/coracao.png" class="img-icons"></a>
            <a href="../perfil/perfil.html"><img src="../imgs/Sample_User_Icon.png" class="img-icons"></a>
            <a href="../pedidos/meusPedidos.html"><img src="../imgs/5087784.png" class="img-icons"></a>
        </div>
    </header>

    <main class="perfil-section">
        <div class="perfil-container">
            <aside class="perfil-sidebar">
                <div class="perfil-header">
                    <img src="../imgs/Sample_User_Icon.png" alt="perfil-avatar" class="avatar">
                    <h3>Olá Cliente</h3>
                    <p>Bem-Vindo(a) de volta</p>
                </div>
                
                <nav class="perfil-menu">
                    <a href="#" class="active">Meus Dados</a>
                    <a href="../pedidos/meusPedidos.html">Meus Pedidos</a>
                    <a href="../favoritos/favoritos.html">Lista de Desejos</a>
                    <button type="button" id="botaoSair" class="botaoSair" onclick="fazerLogout()">Sair da Conta</button>
                </nav>
            </aside>

            <section class="perfil-content">
                <div class="cabecalho-secao">
                    <h2>Dados Pessoais</h2>
                    <p>Atualize suas informações de usuário</p>
                </div>

                <form class="form-perfil">
                    <div class="form-grid">
                        
                        <div class="input-group">
                            <label for="nome">Nome</label>
                            <input type="text" id="nome">
                        </div>

                        <div class="input-group">
                            <label for="sobrenome">Sobrenome</label>
                            <input type="text" id="sobrenome">
                        </div>

                        <div class="input-group">
                            <label for="dataNasc">Data de Nascimento</label>
                            <input type="date" id="dataNasc">
                        </div>

                        <div class="input-group">
                            <label for="cpf">CPF</label>
                            <input type="text" id="cpf" placeholder="###.###.###-##">
                        </div>

                        <div class="input-group">
                            <label for="telefone">Telefone</label>
                            <input type="text" id="telefone" placeholder="(##) ##### - ####">
                        </div>

                        <div class="input-group">
                            <label for="email">E-mail</label>
                            <input type="email" id="email">
                        </div>

                        <div class="input-group span-2">
                            <label for="endereco">Endereço</label>
                            <input type="text" id="endereco" value="Rua da Gueiteira, 443, Vila Dourada">
                        </div>

                        <div class="input-group span-2 genero-group">
                            <label>Gênero</label>
                            <div class="radios">
                                <label><input type="radio" name="genero" value="feminino"> Feminino</label>
                                <label><input type="radio" name="genero" value="masculino"> Masculino</label>
                                <label><input type="radio" name="genero" value="n-informar" checked> Prefiro não informar</label>
                            </div>
                        </div>
                    </div>

                    <div class="form-actions">
                        <button type="button" class="btn-primario" onclick="updateDadosUsuario(event)">Salvar Dados</button>
                    </div>
                </form>

                <hr class="divisor">

                <div class="cabecalho-secao">
                    <h2>Alterar Senha</h2>
                </div>

                <form class="form-perfil">
                    <div class="form-grid">
                        <div class="input-group">
                            <label for="senhaAtual">Senha Atual</label>
                            <input type="password" id="senhaAtual" placeholder="********">
                        </div>

                        <div class="input-group">
                            <label for="novaSenha">Nova Senha</label>
                            <input type="password" id="novaSenha" placeholder="Digite a nova senha">
                        </div>
                    </div>
                    
                    <div class="form-actions">
                        <button type="button" class="btn-primario" onclick="atualizarSenha(event)">Atualizar Senha</button>
                    </div>
                </form>
            </section>
        </div>
    </main>

    <!-- ===== FOOTER PADRÃO ===== -->
    <footer style="text-align: center; padding: 20px; margin-top: 40px;">
        © 2026 <strong>CLM Cosméticos</strong> · Todos os direitos reservados
    </footer>
  
    <script src="script.js"></script>
</body>
</html>
